<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geo AR Quiz — เกม AR แท้</title>

<!-- A-Frame & AR.js CDN -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

/* ให้ A-Frame Canvas และ Video กล้องเต็มจอ */
.a-canvas { z-index: 1 !important; }
video { z-index: 0 !important; }

.hidden { display: none !important; }

/* หน้าต้อนรับ overlay */
.screen {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 20px; text-align: center;
  background: rgba(7, 11, 24, 0.92); color: #fff;
}
.btn {
  border: 0; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: bold;
  cursor: pointer; background: #38bdf8; color: #000; transition: 0.2s;
}
.btn:active { transform: scale(0.95); }

/* HUD ข้อความเตือนกล้อง */
#hud {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 100; pointer-events: none; width: 90%; max-width: 400px;
}
.alert-box {
  background: rgba(0,0,0,0.8); border: 1px solid #fbbf24; color: #fbbf24;
  padding: 10px 16px; border-radius: 30px; font-size: 14px; text-align: center;
}
.score-box {
  background: rgba(0,0,0,0.8); border: 1px solid #38bdf8; color: #38bdf8;
  padding: 8px 16px; border-radius: 20px; font-size: 16px; font-weight: bold;
  margin-bottom: 8px; text-align: center;
}
</style>
</head>
<body>

<!-- หน้าเริ่มเกม -->
<div id="startScreen" class="screen">
  <h1 style="font-size: 32px;">🌍 Geo AR Quiz</h1>
  <p style="color: #9fb3d1; max-width: 320px;">เกมตอบคำถามภูมิศาสตร์แบบ AR แท้ (คำถามและลูกโลกจะลอยอยู่บนมาร์กเกอร์)</p>
  
  <button id="btnStart" class="btn">🕹️ เปิดกล้องเริ่มเล่น AR</button>
  <button id="btnMarker" class="btn" style="background: rgba(255,255,255,0.2); color: #fff;">🖨️ เปิดมาร์กเกอร์ Hiro</button>
</div>

<!-- HUD แสดงสถานะ -->
<div id="hud" class="hidden">
  <div id="scoreText" class="score-box">🏆 คะแนน: 0 / 12</div>
  <div id="noMarkerAlert" class="alert-box">📷 นำกล้องไปส่องที่มาร์กเกอร์ Hiro...</div>
</div>

<!-- A-FRAME AR SCENE -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
  
  <!-- กล้อง + Raycaster สำหรับแตะเลือกคำตอบในฉาก 3D -->
  <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

  <!-- AR Marker (Hiro) -->
  <a-marker preset="hiro" id="hiroMarker">
    
    <!-- กลุ่มวัตถุ 3D ทั้งหมดจะแสดงเฉพาะตอนส่องเจอมาร์กเกอร์เท่านั้น -->
    <a-entity id="arContent" position="0 0 0">
      
      <!-- 1. ลูกโลก 3D หมุนได้ -->
      <a-sphere position="0 0.4 0" radius="0.35" color="#4da6ff" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-sphere>
      <a-sphere position="0 0.4 0" radius="0.36" color="#bfe3ff" wireframe="true" opacity="0.3"
                animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
      </a-sphere>

      <!-- 2. ป้ายการ์ดคำถาม 3D ลอยอยู่เหนือลูกโลก -->
      <a-plane position="0 1.3 0" width="2.2" height="0.5" color="#0f172a" material="opacity: 0.9; transparent: true">
        <a-text id="qText" value="Loading..." align="center" position="0 0 0.01" width="2" color="#38bdf8"></a-text>
      </a-plane>

      <!-- 3. ปุ่มตัวเลือก 3D จำนวน 4 ปุ่ม (จัดวางเรียง 2x2) -->
      <!-- ปุ่มที่ 1 (ซ้ายบน) -->
      <a-plane id="btnOpt0" class="clickable" position="-0.6 0.9 0" width="1" height="0.25" color="#1e293b"
               event-set__mouseenter="_event: mouseenter; color: #3b82f6"
               event-set__mouseleave="_event: mouseleave; color: #1e293b">
        <a-text id="txtOpt0" value="Option 1" align="center" position="0 0 0.01" width="1.8" color="#ffffff"></a-text>
      </a-plane>

      <!-- ปุ่มที่ 2 (ขวาบน) -->
      <a-plane id="btnOpt1" class="clickable" position="0.6 0.9 0" width="1" height="0.25" color="#1e293b">
        <a-text id="txtOpt1" value="Option 2" align="center" position="0 0 0.01" width="1.8" color="#ffffff"></a-text>
      </a-plane>

      <!-- ปุ่มที่ 3 (ซ้ายล่าง) -->
      <a-plane id="btnOpt2" class="clickable" position="-0.6 0.6 0" width="1" height="0.25" color="#1e293b">
        <a-text id="txtOpt2" value="Option 3" align="center" position="0 0 0.01" width="1.8" color="#ffffff"></a-text>
      </a-plane>

      <!-- ปุ่มที่ 4 (ขวาล่าง) -->
      <a-plane id="btnOpt3" class="clickable" position="0.6 0.6 0" width="1" height="0.25" color="#1e293b">
        <a-text id="txtOpt3" value="Option 4" align="center" position="0 0 0.01" width="1.8" color="#ffffff"></a-text>
      </a-plane>

    </a-entity>
  </a-marker>

</a-scene>

<script>
'use strict';

const QUESTIONS = [
  { name: 'Everest Mountain', answer: 'Nepal', options: ['Bhutan', 'Nepal', 'China', 'India'] },
  { name: 'Pyramids of Giza', answer: 'Egypt', options: ['Mexico', 'Greece', 'Egypt', 'Iraq'] },
  { name: 'Niagara Falls', answer: 'USA-Canada', options: ['USA-Canada', 'Brazil', 'Nigeria', 'Indonesia'] },
  { name: 'Angkor Wat', answer: 'Cambodia', options: ['Thailand', 'Myanmar', 'Cambodia', 'Laos'] },
  { name: 'Eiffel Tower', answer: 'France', options: ['Spain', 'Italy', 'Germany', 'France'] },
  { name: 'Machu Picchu', answer: 'Peru', options: ['Peru', 'Colombia', 'Mexico', 'Bolivia'] }
];

let qIndex = 0;
let score = 0;
let isLocked = false;

const startScreen = document.getElementById('startScreen');
const hud = document.getElementById('hud');
const noMarkerAlert = document.getElementById('noMarkerAlert');
const scoreText = document.getElementById('scoreText');

// สลับการแสดงคำถามลงในวัตถุ 3D บน AR
function loadQuestion() {
  if (qIndex >= QUESTIONS.length) {
    document.getElementById('qText').setAttribute('value', 'Game Over! Score: ' + score);
    return;
  }

  isLocked = false;
  const q = QUESTIONS[qIndex];
  
  // ใส่ข้อความในวัตถุ 3D
  document.getElementById('qText').setAttribute('value', (qIndex + 1) + '. ' + q.name);

  q.options.forEach((opt, idx) => {
    const btn = document.getElementById('btnOpt' + idx);
    const txt = document.getElementById('txtOpt' + idx);
    txt.setAttribute('value', opt);
    btn.setAttribute('color', '#1e293b'); // คืนสีตั้งต้น
  });
}

function checkAnswer(optIndex) {
  if (isLocked) return;
  isLocked = true;

  const q = QUESTIONS[qIndex];
  const selectedOpt = q.options[optIndex];
  const btn = document.getElementById('btnOpt' + optIndex);

  if (selectedOpt === q.answer) {
    score++;
    btn.setAttribute('color', '#16a34a'); // สีเขียวเมื่อถูก
  } else {
    btn.setAttribute('color', '#dc2626'); // สีแดงเมื่อผิด
  }

  scoreText.innerText = `🏆 คะแนน: ${score} / ${QUESTIONS.length}`;

  setTimeout(() => {
    qIndex++;
    loadQuestion();
  }, 1500);
}

// ผูก Event แตะปุ่ม 3D
for (let i = 0; i < 4; i++) {
  const btn = document.getElementById('btnOpt' + i);
  btn.addEventListener('click', () => checkAnswer(i));
}

// เริ่มเกมเปิดกล้อง
document.getElementById('btnStart').onclick = () => {
  startScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  loadQuestion();
};

document.getElementById('btnMarker').onclick = () => {
  window.open('https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png', '_blank');
};

// ตรวจจับ Marker
const marker = document.getElementById('hiroMarker');
marker.addEventListener('markerFound', () => {
  noMarkerAlert.style.display = 'none';
});
marker.addEventListener('markerLost', () => {
  noMarkerAlert.style.display = 'block';
});
</script>
</body>
</html>
