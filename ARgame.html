<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geo AR Quiz — AR 3D Top-View</title>

<!-- A-Frame & AR.js CDN -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

.a-canvas { z-index: 1 !important; }
video { z-index: 0 !important; }

.hidden { display: none !important; }

/* หน้าต้อนรับ overlay */
.screen {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 20px; text-align: center;
  background: rgba(7, 11, 24, 0.92); color: #fff;
}
.btn {
  border: 0; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: bold;
  cursor: pointer; background: #38bdf8; color: #000; transition: 0.2s;
}
.btn:active { transform: scale(0.95); }

/* HUD แสดงสถานะ */
#hud {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 100; pointer-events: none; width: 90%; max-width: 400px;
}
.alert-box {
  background: rgba(0,0,0,0.8); border: 1px solid #fbbf24; color: #fbbf24;
  padding: 10px 16px; border-radius: 30px; font-size: 14px; text-align: center;
}
.score-box {
  background: rgba(0,0,0,0.8); border: 1px solid #38bdf8; color: #38bdf8;
  padding: 8px 16px; border-radius: 20px; font-size: 16px; font-weight: bold;
  margin-bottom: 8px; text-align: center;
}
</style>
</head>
<body>

<!-- Canvas ซ่อนไว้สำหรับสร้าง Texture ภาษาไทย -->
<canvas id="textCanvas" width="512" height="128" style="display:none;"></canvas>

<!-- หน้าเริ่มเกม -->
<div id="startScreen" class="screen">
  <h1 style="font-size: 32px;">🌍 Geo AR Quiz</h1>
  <p style="color: #9fb3d1; max-width: 320px;">เกมตอบคำถามภูมิศาสตร์แบบ AR แท้ (คำถามลอยบนมาร์กเกอร์ปรับมุมมอง Top-View)</p>
  
  <button id="btnStart" class="btn">🕹️ เปิดกล้องเริ่มเล่น AR</button>
  <button id="btnMarker" class="btn" style="background: rgba(255,255,255,0.2); color: #fff;">🖨️ เปิดมาร์กเกอร์ Hiro</button>
</div>

<!-- HUD แสดงสถานะ -->
<div id="hud" class="hidden">
  <div id="scoreText" class="score-box">🏆 คะแนน: 0 / 6</div>
  <div id="noMarkerAlert" class="alert-box">📷 นำกล้องไปส่องที่มาร์กเกอร์ Hiro...</div>
</div>

<!-- A-FRAME AR SCENE -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
  
  <!-- กล้อง + Raycaster สำหรับแตะเลือกคำตอบในฉาก 3D -->
  <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

  <!-- AR Marker (Hiro) -->
  <a-marker preset="hiro" id="hiroMarker">
    
    <!-- ปรับมุมมองรวมของวัตถุ 3D ทั้งหมดให้ทำมุมนอนเอียงขึ้นเข้าหากล้องแบบ Top-View (-60 องศา) -->
    <a-entity id="arContent" position="0 0 0" rotation="-60 0 0">
      
      <!-- 1. ลูกโลก 3D หมุนได้ -->
      <a-sphere position="0 0.2 0" radius="0.35" color="#4da6ff" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-sphere>
      <a-sphere position="0 0.2 0" radius="0.36" color="#bfe3ff" wireframe="true" opacity="0.3"
                animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
      </a-sphere>

      <!-- 2. ป้ายการ์ดคำถาม 3D ลอยอยู่เหนือลูกโลก (ปรับองศาให้หันมาทางผู้เล่นตั้งฉากพอดี) -->
      <a-plane id="cardQ" position="0 0.9 0" width="2.4" height="0.6" color="#0f172a" material="opacity: 0.9; transparent: true">
      </a-plane>

      <!-- 3. ปุ่มตัวเลือก 3D จำนวน 4 ปุ่ม (จัดวางเรียง 2x2) -->
      <!-- ปุ่มที่ 1 (ซ้ายบน) -->
      <a-plane id="btnOpt0" class="clickable" position="-0.65 0.45 0.1" width="1.1" height="0.28" color="#1e293b"></a-plane>

      <!-- ปุ่มที่ 2 (ขวาบน) -->
      <a-plane id="btnOpt1" class="clickable" position="0.65 0.45 0.1" width="1.1" height="0.28" color="#1e293b"></a-plane>

      <!-- ปุ่มที่ 3 (ซ้ายล่าง) -->
      <a-plane id="btnOpt2" class="clickable" position="-0.65 0.12 0.1" width="1.1" height="0.28" color="#1e293b"></a-plane>

      <!-- ปุ่มที่ 4 (ขวาล่าง) -->
      <a-plane id="btnOpt3" class="clickable" position="0.65 0.12 0.1" width="1.1" height="0.28" color="#1e293b"></a-plane>

    </a-entity>
  </a-marker>

</a-scene>

<script>
'use strict';

const QUESTIONS = [
  { name: 'ยอดเขาเอเวอเรสต์', answer: 'เนปาล', options: ['ภูฏาน', 'เนปาล', 'จีน', 'อินเดีย'] },
  { name: 'พีระมิดกีซ่า', answer: 'อียิปต์', options: ['เม็กซิโก', 'กรีซ', 'อียิปต์', 'อิรัก'] },
  { name: 'น้ำตกไนแอการา', answer: 'สหรัฐฯ-แคนาดา', options: ['สหรัฐฯ-แคนาดา', 'บราซิล', 'ไนจีเรีย', 'อินโดนีเซีย'] },
  { name: 'นครวัด', answer: 'กัมพูชา', options: ['ไทย', 'เมียนมา', 'กัมพูชา', 'ลาว'] },
  { name: 'หอไอเฟล', answer: 'ฝรั่งเศส', options: ['สเปน', 'อิตาลี', 'เยอรมนี', 'ฝรั่งเศส'] },
  { name: 'มาชูปิกชู', answer: 'เปรู', options: ['เปรู', 'โคลอมเบีย', 'เม็กซิโก', 'โบลิเวีย'] }
];

let qIndex = 0;
let score = 0;
let isLocked = false;

const startScreen = document.getElementById('startScreen');
const hud = document.getElementById('hud');
const noMarkerAlert = document.getElementById('noMarkerAlert');
const scoreText = document.getElementById('scoreText');

// ฟังก์ชันสร้าง Canvas Texture ภาษาไทยให้คมชัด ไม่กลับหัว
function createTextTexture(text, bgColor, textColor, fontSize = '28px') {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  // พื้นหลัง
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // กรอบ
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  // ตัวอักษร
  ctx.fillStyle = textColor;
  ctx.font = `Bold ${fontSize} sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  return new THREE.CanvasTexture(canvas);
}

function updatePlaneTexture(planeId, text, bgColor = '#1e293b', textColor = '#ffffff', fontSize = '32px') {
  const planeEl = document.getElementById(planeId);
  if (!planeEl) return;
  
  const texture = createTextTexture(text, bgColor, textColor, fontSize);
  const mesh = planeEl.getObject3D('mesh');
  if (mesh) {
    mesh.material.map = texture;
    mesh.material.needsUpdate = true;
  }
}

// สลับการแสดงคำถามลงในวัตถุ 3D บน AR
function loadQuestion() {
  if (qIndex >= QUESTIONS.length) {
    updatePlaneTexture('cardQ', `จบเกม! คะแนน: ${score}/${QUESTIONS.length}`, '#0f172a', '#38bdf8', '36px');
    return;
  }

  isLocked = false;
  const q = QUESTIONS[qIndex];
  
  // วาดคำถามลงบนแผ่น 3D Card
  updatePlaneTexture('cardQ', `${qIndex + 1}. ${q.name} อยู่ที่ไหน?`, '#0f172a', '#38bdf8', '32px');

  // วาดตัวเลือก 4 ปุ่ม
  q.options.forEach((opt, idx) => {
    updatePlaneTexture('btnOpt' + idx, opt, '#1e293b', '#ffffff', '30px');
  });
}

function checkAnswer(optIndex) {
  if (isLocked) return;
  isLocked = true;

  const q = QUESTIONS[qIndex];
  const selectedOpt = q.options[optIndex];

  if (selectedOpt === q.answer) {
    score++;
    updatePlaneTexture('btnOpt' + optIndex, selectedOpt, '#16a34a', '#ffffff', '30px');
  } else {
    updatePlaneTexture('btnOpt' + optIndex, selectedOpt, '#dc2626', '#ffffff', '30px');
  }

  scoreText.innerText = `🏆 คะแนน: ${score} / ${QUESTIONS.length}`;

  setTimeout(() => {
    qIndex++;
    loadQuestion();
  }, 1500);
}

// ผูก Event แตะปุ่ม 3D
for (let i = 0; i < 4; i++) {
  const btn = document.getElementById('btnOpt' + i);
  btn.addEventListener('click', () => checkAnswer(i));
}

// เริ่มเกมเปิดกล้อง
document.getElementById('btnStart').onclick = () => {
  startScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  
  // รอให้ Scene โหลดเสร็จก่อนสร้าง Texture
  setTimeout(() => {
    loadQuestion();
  }, 500);
};

document.getElementById('btnMarker').onclick = () => {
  window.open('https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png', '_blank');
};

// ตรวจจับ Marker
const marker = document.getElementById('hiroMarker');
marker.addEventListener('markerFound', () => {
  noMarkerAlert.style.display = 'none';
});
marker.addEventListener('markerLost', () => {
  noMarkerAlert.style.display = 'block';
});
</script>
</body>
</html>
