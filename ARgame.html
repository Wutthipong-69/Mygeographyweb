<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geo AR Quiz — เกม AR Top-View</title>

<!-- โหลด A-Frame และ AR.js Stable CDN -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }

/* จัดลำดับ layer วิดีโอกล้องให้อยู่หลังสุด */
video {
  position: fixed !important; top: 0 !important; left: 0 !important;
  width: 100% !important; height: 100% !important; object-fit: cover !important; z-index: -2 !important;
}
.a-canvas {
  position: fixed !important; top: 0 !important; left: 0 !important;
  width: 100% !important; height: 100% !important; z-index: -1 !important;
}

.hidden { display: none !important; }

/* หน้าเริ่มเกม */
.screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 20px; text-align: center;
  background: radial-gradient(1200px 600px at 50% -10%, #16233f 0%, #070b18 80%); color: #fff;
}
.btn {
  border: 0; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: bold;
  cursor: pointer; background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff;
  box-shadow: 0 8px 24px rgba(56,189,248,.35);
}
.btn.ghost { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
.btn:active { transform: scale(0.95); }

/* HUD UI บนหน้าจอ (Top-View Viewport) */
#hud {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
  justify-content: space-between; padding: 16px; pointer-events: none;
}
.topbar { display: flex; justify-content: space-between; gap: 8px; }
.chip { 
  background: rgba(7,11,24,0.88); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: bold; color: #fff; backdrop-filter: blur(8px); 
}

#noMarkerAlert {
  align-self: center; background: rgba(7,11,24,0.92); border: 1px solid #fbbf24;
  color: #fbbf24; padding: 12px 24px; border-radius: 30px; font-size: 15px; font-weight: bold; text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

/* Card คำถามถูกล็อกให้อยู่ในมุมมองอ่านง่ายเสมอ */
#questionCard {
  pointer-events: auto; background: rgba(7,11,24,0.92); border: 1px solid rgba(255,255,255,0.25);
  border-radius: 18px; padding: 18px; backdrop-filter: blur(12px); max-width: 500px; width: 100%; margin: 0 auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.q-title { font-size: 18px; font-weight: bold; text-align: center; color: #38bdf8; margin-bottom: 14px; line-height: 1.4; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans-btn {
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff;
  border-radius: 12px; padding: 14px 10px; font-size: 15px; cursor: pointer; font-weight: 600;
  transition: all 0.15s ease;
}
.ans-btn.correct { background: #16a34a !important; border-color: #22c55e !important; }
.ans-btn.wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
</style>
</head>
<body>

<!-- หน้าเริ่มเกม -->
<div id="startScreen" class="screen">
  <h1 style="font-size: 32px;">🌍 Geo AR Quiz</h1>
  <p style="color: #9fb3d1; max-width: 340px;">ส่องกล้องไปที่มาร์กเกอร์ Hiro เพื่อแสดงโมเดล 3D และเริ่มตอบคำถาม</p>
  <button id="btnStart" class="btn">🕹️ เปิดกล้องเริ่มเล่น AR</button>
  <button id="btnMarker" class="btn ghost">🖨️ เปิดดูมาร์กเกอร์ (Hiro)</button>
</div>

<!-- HUD สำหรับเล่นเกม -->
<div id="hud" class="hidden">
  <div class="topbar">
    <div class="chip">🏆 คะแนน: <span id="score">0</span></div>
    <div class="chip" id="qNum">ข้อที่ 1 / 6</div>
  </div>

  <div id="noMarkerAlert">📷 เอากล้องเล็งไปที่มาร์กเกอร์ Hiro...</div>

  <div id="questionCard" class="hidden">
    <div id="qTitle" class="q-title">กำลังโหลดคำถาม...</div>
    <div id="answers" class="answers"></div>
  </div>
</div>

<!-- A-FRAME AR SCENE -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
  
  <!-- AR Marker (Hiro) -->
  <a-marker preset="hiro" id="hiroMarker">
    <!-- กลุ่มวัตถุ 3D ปรับทิศทางให้แสดงผลสวยงามเมื่อมองจากมุมบน (Top-View) -->
    <a-entity position="0 0 0">
      <!-- 1. ลูกโลก 3D -->
      <a-sphere position="0 0.6 0" radius="0.45" color="#38bdf8"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-sphere>
      <!-- 2. ตะแกรงโครงสร้างลูกโลก -->
      <a-sphere position="0 0.6 0" radius="0.47" color="#ffffff" wireframe="true" opacity="0.35"
                animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
      </a-sphere>
      <!-- 3. วงแหวนทองรอบลูกโลก ปรับองศาเข้าหากล้อง -->
      <a-torus position="0 0.6 0" radius="0.75" radius-tubular="0.02" color="#fbbf24" rotation="45 0 0"
               animation="property: rotation; to: 45 360 0; loop: true; dur: 6000; easing: linear">
      </a-torus>
      <!-- 4. ฐานแสงเรืองรองใต้ลูกโลกบนมาร์กเกอร์ -->
      <a-ring position="0 0.05 0" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.8" color="#38bdf8" opacity="0.6"
              animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1500"></a-ring>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
'use strict';

const QUESTIONS = [
  { name: 'ยอดเขาเอเวอเรสต์ (Everest)', answer: 'เนปาล', options: ['ภูฏาน', 'เนปาล', 'จีน', 'อินเดีย'] },
  { name: 'พีระมิดกีซ่า (Pyramids of Giza)', answer: 'อียิปต์', options: ['เม็กซิโก', 'กรีซ', 'อียิปต์', 'อิรัก'] },
  { name: 'น้ำตกไนแอการา (Niagara Falls)', answer: 'สหรัฐฯ–แคนาดา', options: ['สหรัฐฯ–แคนาดา', 'บราซิล', 'ไนจีเรีย', 'อินโดนีเซีย'] },
  { name: 'นครวัด (Angkor Wat)', answer: 'กัมพูชา', options: ['ไทย', 'เมียนมา', 'กัมพูชา', 'ลาว'] },
  { name: 'หอไอเฟล (Eiffel Tower)', answer: 'ฝรั่งเศส', options: ['สเปน', 'อิตาลี', 'เยอรมนี', 'ฝรั่งเศส'] },
  { name: 'มาชูปิกชู (Machu Picchu)', answer: 'เปรู', options: ['เปรู', 'โคลอมเบีย', 'เม็กซิโก', 'โบลิเวีย'] }
];

let qIndex = 0;
let score = 0;
let isLocked = false;

const startScreen = document.getElementById('startScreen');
const hud = document.getElementById('hud');
const noMarkerAlert = document.getElementById('noMarkerAlert');
const questionCard = document.getElementById('questionCard');
const qTitle = document.getElementById('qTitle');
const answersContainer = document.getElementById('answers');

function loadQuestion() {
  if (qIndex >= QUESTIONS.length) {
    qTitle.textContent = `🎉 จบเกม! คุณได้ ${score} / ${QUESTIONS.length} คะแนน`;
    answersContainer.innerHTML = '';
    return;
  }

  isLocked = false;
  const q = QUESTIONS[qIndex];
  document.getElementById('qNum').textContent = `ข้อที่ ${qIndex + 1} / ${QUESTIONS.length}`;
  qTitle.textContent = `${qIndex + 1}. ${q.name} ตั้งอยู่ที่ประเทศใด?`;

  answersContainer.innerHTML = '';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, btn);
    answersContainer.appendChild(btn);
  });
}

function checkAnswer(selectedOpt, btn) {
  if (isLocked) return;
  isLocked = true;

  const q = QUESTIONS[qIndex];
  const allBtns = answersContainer.querySelectorAll('.ans-btn');

  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });

  if (selectedOpt === q.answer) {
    score++;
    document.getElementById('score').textContent = score;
  } else {
    btn.classList.add('wrong');
  }

  setTimeout(() => {
    qIndex++;
    loadQuestion();
  }, 1600);
}

// ตรวจจับ Marker
const marker = document.getElementById('hiroMarker');

marker.addEventListener('markerFound', () => {
  noMarkerAlert.classList.add('hidden');
  questionCard.classList.remove('hidden');
});

marker.addEventListener('markerLost', () => {
  noMarkerAlert.classList.remove('hidden');
  questionCard.classList.add('hidden');
});

// เริ่มเกม
document.getElementById('btnStart').onclick = () => {
  startScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  loadQuestion();
};

document.getElementById('btnMarker').onclick = () => {
  window.open('https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png', '_blank');
};
</script>
</body>
</html>
