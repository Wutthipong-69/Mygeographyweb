<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geo AR Quiz — AR 3D Top-View</title>

<!-- ใช้ CDN ที่เสถียรที่สุดสำหรับ iOS Safari / Android -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

/* จัดการ Layer ให้ Video กล้องทำงานด้านหลังสุดแน่นอน */
.a-canvas { z-index: 1 !important; }
video { z-index: 0 !important; position: absolute !important; top: 0 !important; left: 0 !important; }

.hidden { display: none !important; }

/* หน้าต้อนรับ overlay */
.screen {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 20px; text-align: center;
  background: rgba(7, 11, 24, 0.95); color: #fff;
}
.btn {
  border: 0; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: bold;
  cursor: pointer; background: #38bdf8; color: #000; transition: 0.2s;
}
.btn:active { transform: scale(0.95); }

/* HUD แสดงสถานะ */
#hud {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 100; pointer-events: none; width: 90%; max-width: 400px;
}
.alert-box {
  background: rgba(0,0,0,0.85); border: 1px solid #fbbf24; color: #fbbf24;
  padding: 10px 16px; border-radius: 30px; font-size: 14px; text-align: center;
}
.score-box {
  background: rgba(0,0,0,0.85); border: 1px solid #38bdf8; color: #38bdf8;
  padding: 8px 16px; border-radius: 20px; font-size: 16px; font-weight: bold;
  margin-bottom: 8px; text-align: center;
}
</style>
</head>
<body>

<!-- หน้าเริ่มเกม -->
<div id="startScreen" class="screen">
  <h1 style="font-size: 32px;">🌍 Geo AR Quiz</h1>
  <p style="color: #9fb3d1; max-width: 320px;">ส่องกล้องไปที่มาร์กเกอร์ Hiro เพื่อตอบคำถามภูมิศาสตร์แบบ AR (มุมมอง Top-View อ่านง่าย)</p>
  
  <button id="btnStart" class="btn">🕹️ เปิดกล้องเริ่มเล่น AR</button>
  <button id="btnMarker" class="btn" style="background: rgba(255,255,255,0.2); color: #fff;">🖨️ เปิดมาร์กเกอร์ Hiro</button>
</div>

<!-- HUD แสดงสถานะ -->
<div id="hud" class="hidden">
  <div id="scoreText" class="score-box">🏆 คะแนน: 0 / 6</div>
  <div id="noMarkerAlert" class="alert-box">📷 นำกล้องไปส่องที่มาร์กเกอร์ Hiro...</div>
</div>

<!-- A-FRAME AR SCENE -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" vr-mode-ui="enabled: false">
  
  <!-- กล้อง + Raycaster แตะวัตถุ 3D -->
  <a-entity id="mainCamera" camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

  <!-- AR Marker (Hiro) -->
  <a-marker preset="hiro" id="hiroMarker">
    
    <!-- วัตถุ 3D บนมาร์กเกอร์ -->
    <a-entity id="arContent" position="0 0 0">
      
      <!-- 1. ลูกโลก 3D หมุนได้ตรงกลางมาร์กเกอร์ -->
      <a-sphere position="0 0.2 0" radius="0.35" color="#4da6ff" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-sphere>
      <a-sphere position="0 0.2 0" radius="0.36" color="#bfe3ff" wireframe="true" opacity="0.3"
                animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
      </a-sphere>

      <!-- 2. กลุ่มแผ่นป้ายคำถามและปุ่มตอบ (ปรับมุมให้อยู่ในแนวตั้งรับสายตา Top-View) -->
      <a-entity id="uiGroup" position="0 0.8 0" rotation="-40 0 0">
        
        <!-- แผ่นป้ายคำถาม -->
        <a-plane id="cardQ" position="0 0.5 0" width="2.4" height="0.5" color="#0f172a" material="opacity: 0.95; transparent: true"></a-plane>

        <!-- ปุ่มตัวเลือก 4 ปุ่ม (เรียง 2x2) -->
        <a-plane id="btnOpt0" class="clickable" position="-0.65 0.1 0" width="1.1" height="0.25" color="#1e293b"></a-plane>
        <a-plane id="btnOpt1" class="clickable" position="0.65 0.1 0" width="1.1" height="0.25" color="#1e293b"></a-plane>
        <a-plane id="btnOpt2" class="clickable" position="-0.65 -0.2 0" width="1.1" height="0.25" color="#1e293b"></a-plane>
        <a-plane id="btnOpt3" class="clickable" position="0.65 -0.2 0" width="1.1" height="0.25" color="#1e293b"></a-plane>

      </a-entity>

    </a-entity>
  </a-marker>

</a-scene>

<script>
'use strict';

const QUESTIONS = [
  { name: 'ยอดเขาเอเวอเรสต์', answer: 'เนปาล', options: ['ภูฏาน', 'เนปาล', 'จีน', 'อินเดีย'] },
  { name: 'พีระมิดกีซ่า', answer: 'อียิปต์', options: ['เม็กซิโก', 'กรีซ', 'อียิปต์', 'อิรัก'] },
  { name: 'น้ำตกไนแอการา', answer: 'สหรัฐฯ-แคนาดา', options: ['สหรัฐฯ-แคนาดา', 'บราซิล', 'ไนจีเรีย', 'อินโดนีเซีย'] },
  { name: 'นครวัด', answer: 'กัมพูชา', options: ['ไทย', 'เมียนมา', 'กัมพูชา', 'ลาว'] },
  { name: 'หอไอเฟล', answer: 'ฝรั่งเศส', options: ['สเปน', 'อิตาลี', 'เยอรมนี', 'ฝรั่งเศส'] },
  { name: 'มาชูปิกชู', answer: 'เปรู', options: ['เปรู', 'โคลอมเบีย', 'เม็กซิโก', 'โบลิเวีย'] }
];

let qIndex = 0;
let score = 0;
let isLocked = false;

const startScreen = document.getElementById('startScreen');
const hud = document.getElementById('hud');
const noMarkerAlert = document.getElementById('noMarkerAlert');
const scoreText = document.getElementById('scoreText');

// ฟังก์ชันสร้าง Canvas Texture ข้อความภาษาไทยอย่างปลอดภัย
function generateTexture(text, bgColor = '#1e293b', textColor = '#ffffff') {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = textColor;
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  return texture;
}

function applyTexture(elemId, text, bgColor, textColor) {
  const el = document.getElementById(elemId);
  if (!el) return;
  const mesh = el.getObject3D('mesh');
  if (mesh && mesh.material) {
    mesh.material.map = generateTexture(text, bgColor, textColor);
    mesh.material.needsUpdate = true;
  }
}

function loadQuestion() {
  if (qIndex >= QUESTIONS.length) {
    applyTexture('cardQ', `จบเกม! คะแนน: ${score}/${QUESTIONS.length}`, '#0f172a', '#38bdf8');
    return;
  }

  isLocked = false;
  const q = QUESTIONS[qIndex];

  applyTexture('cardQ', `${qIndex + 1}. ${q.name} อยู่ที่ไหน?`, '#0f172a', '#38bdf8');

  q.options.forEach((opt, idx) => {
    applyTexture('btnOpt' + idx, opt, '#1e293b', '#ffffff');
  });
}

function checkAnswer(optIndex) {
  if (isLocked) return;
  isLocked = true;

  const q = QUESTIONS[qIndex];
  const selectedOpt = q.options[optIndex];

  if (selectedOpt === q.answer) {
    score++;
    applyTexture('btnOpt' + optIndex, selectedOpt, '#16a34a', '#ffffff');
  } else {
    applyTexture('btnOpt' + optIndex, selectedOpt, '#dc2626', '#ffffff');
  }

  scoreText.innerText = `🏆 คะแนน: ${score} / ${QUESTIONS.length}`;

  setTimeout(() => {
    qIndex++;
    loadQuestion();
  }, 1500);
}

// ผูกระบบคลิกบนวัตถุ 3D
for (let i = 0; i < 4; i++) {
  const btn = document.getElementById('btnOpt' + i);
  btn.addEventListener('click', () => checkAnswer(i));
}

// เริ่มระบบเมื่อผู้ใช้กดปุ่มเปิดกล้อง
document.getElementById('btnStart').onclick = () => {
  startScreen.classList.add('hidden');
  hud.classList.remove('hidden');

  // รอให้ A-Frame Scene โหลดเสร็จสมบูรณ์ก่อนใส่ Texture
  const scene = document.querySelector('a-scene');
  if (scene.hasLoaded) {
    loadQuestion();
  } else {
    scene.addEventListener('loaded', loadQuestion);
  }
};

document.getElementById('btnMarker').onclick = () => {
  window.open('https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png', '_blank');
};

// ตรวจจับ มาร์กเกอร์
const marker = document.getElementById('hiroMarker');
marker.addEventListener('markerFound', () => {
  noMarkerAlert.style.display = 'none';
});
marker.addEventListener('markerLost', () => {
  noMarkerAlert.style.display = 'block';
});
</script>
</body>
</html>
